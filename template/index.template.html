<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlgaeWatch — federal freshwater cyanobacteria watchlist</title>
<style>
:root{
  --bg:#0b0b14; --bg2:#13131f; --bg3:#1a1a2e; --bg4:#22223a;
  --border:#2a2a45; --text:#e8e8f0; --text2:#9898b8; --text3:#6868a0;
  --accent:#6366f1; --accent-dim:rgba(99,102,241,0.12);
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --cyan:#22d3ee;
  --radius:12px; --radius-sm:8px; --radius-xs:6px;
  --font:'Segoe UI','Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;line-height:1.2}
a{color:var(--cyan)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;padding:18px 16px;border-bottom:1px solid var(--border);background:var(--bg2)}
.brand h1{font-size:22px;letter-spacing:.2px}
.brand h1 span{color:var(--cyan)}
.brand .sub{margin:4px 0 0;color:var(--text2);font-size:12.5px}
.meta{display:flex;flex-direction:column;gap:6px;align-items:flex-end;text-align:right}
.stamp{color:var(--text3);font-size:12px}
.banner{padding:7px 10px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;max-width:520px}
.banner.warn{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.45);color:#fcd34d}
.banner.synth{background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.55);color:#fca5a5}
.hidden{display:none!important}
/* ---------- tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:5}
.tab{background:transparent;border:1px solid var(--border);color:var(--text2);padding:7px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;transition:all .15s}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--text);font-weight:600}
.tab .n{color:var(--text3);font-size:11px;margin-left:5px}
/* ---------- cards / layout ---------- */
.app{padding:16px}
.grid{display:grid;gap:12px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.card h2{font-size:15px;margin-bottom:8px}
.card h3{font-size:13px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.note{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--text2)}
.note.warn{border-left-color:var(--amber);color:#fcd34d}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text3)}
.kv .v{color:var(--text);text-align:right}
/* ---------- table ---------- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--text3);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.dim{color:var(--text3)}
/* ---------- chips ---------- */
.chip{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap;border:1px solid transparent}
.chip.stale{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.5);color:#fcd34d}
.chip.exceed{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.55);color:#fca5a5}
.chip.approach{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.45);color:#fcd34d}
.chip.nodata{background:rgba(152,152,184,.14);border-color:rgba(152,152,184,.35);color:var(--text3)}
.chip.unver{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.45);color:#fcd34d}
.chip.ok{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4);color:#86efac}
/* ---------- map ---------- */
.mapbox{position:relative;width:100%;background:#0d1420;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tiles{position:absolute;inset:0;opacity:.85;pointer-events:none}
.tiles img{position:absolute;width:auto;image-rendering:auto}
.mapbox canvas{position:relative;display:block;width:100%;height:auto}
.mapstatus{position:absolute;left:8px;bottom:8px;font-size:11px;color:var(--text3);background:rgba(11,11,20,.75);padding:3px 7px;border-radius:var(--radius-xs)}
.legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px;color:var(--text2);margin-top:8px}
.sw{display:inline-flex;align-items:center;gap:5px}
.sw i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* ---------- misc ---------- */
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:var(--radius-xs);font:inherit;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent-dim);border-color:var(--accent);font-weight:600}
select{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-xs);padding:6px 8px;font:inherit;font-size:12.5px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1 1 auto}
.empty{padding:26px 14px;text-align:center;color:var(--text3);border:1px dashed var(--border);border-radius:var(--radius-sm)}
.foot{padding:18px 16px 34px;color:var(--text3);font-size:12px;border-top:1px solid var(--border);margin-top:20px}
.chartbox{width:100%;overflow-x:auto}
canvas.chart{width:100%;height:auto;display:block}
ul.tight{margin:6px 0 0;padding-left:18px;color:var(--text2);font-size:13px}
ul.tight li{margin:3px 0}
.map-wrap{position:relative}
.mapctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;z-index:3}
.mapctl .btn{min-width:42px;height:30px;padding:0 7px;font-weight:700;background:rgba(19,19,31,.88);border-color:var(--border)}
.mapctl .btn:hover{border-color:var(--accent);color:#fff}
.mapbox canvas{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.mapbox canvas:active{cursor:grabbing}
.maphint{font-size:11.5px;margin-top:6px}
@media (max-width:640px){
  body{font-size:14.5px}
  .wrap,.app{padding:12px}
  .brand h1{font-size:19px}
  .meta{align-items:flex-start;text-align:left}
  .top{flex-direction:column}
  .banner{max-width:100%}
  table{min-width:460px}
  .card{padding:11px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Algae<span>Watch</span></h1>
    <p class="sub">Freshwater cyanobacteria (harmful algal bloom) watchlist · official U.S. federal sources only: NOAA · USGS · EPA · NWS</p>
  </div>
  <div class="meta">
    <div id="modeBanner" class="banner synth hidden"></div>
    <div id="thresholdFlag" class="banner warn hidden"></div>
    <div class="stamp">data baked <span id="genStamp">—</span></div>
  </div>
</header>

<nav id="tabs" class="tabs" role="tablist"></nav>
<main id="app" class="app"></main>
<footer class="foot">
  <p id="footNote"></p>
</footer>

<script>
  window.__ALGAEWATCH_DATA__ = /*__ALGAEWATCH_DATA__*/;
</script>
<script>
(function () {
  'use strict';

  var BLOB = (typeof window !== 'undefined' && window.__ALGAEWATCH_DATA__) ? window.__ALGAEWATCH_DATA__ : null;
  var LS_KEY = 'algaewatch_state';
  var VIEWS = [
    { id: 'map', label: 'Map' },
    { id: 'watchlist', label: 'Watchlist' },
    { id: 'site', label: 'Site detail' },
    { id: 'anomaly', label: 'Anomaly' },
    { id: 'alerts', label: 'Alerts' },
    { id: 'sources', label: 'Sources' }
  ];
  var MAP_EXTENT = { lon0: -125, lon1: -66.5, lat0: 24, lat1: 49.5 };
  var mapView = null;          // current Mercator view, lazily fitted on first paint
  var COLORS = [
    { max: 1, c: '#155e75', label: '< 1' },
    { max: 3, c: '#0e7490', label: '1–3' },
    { max: 10, c: '#22c55e', label: '3–10' },
    { max: 30, c: '#f59e0b', label: '10–30' },
    { max: 100, c: '#ef4444', label: '30–100' },
    { max: Infinity, c: '#7f1d1d', label: '> 100' }
  ];

  /* ------------------------------------------------------------------ utils */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  // A missing value is NEVER rendered as 0. null / undefined / NaN -> em dash.
  function fmtValue(v, unit) {
    if (!isNum(v)) return '—';
    var a = Math.abs(v);
    var dp = a >= 100 ? 0 : (a >= 10 ? 1 : 2);
    return v.toFixed(dp) + (unit ? ' ' + unit : '');
  }
  function toDate(ts) {
    if (!ts) return null;
    var s = String(ts);
    // Every timestamp the collector emits is UTC, but NWS strings carry no
    // zone designator. new Date() would read those as LOCAL time, and mixing
    // the two made a same-day NWS alert render as "future-dated". Treat any
    // naive timestamp as UTC.
    if (!/(Z|[+-]\d{2}:?\d{2})$/.test(s)) {
      s = (s.indexOf('T') > 0) ? s + 'Z' : s + 'T00:00:00Z';
    }
    var d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }
  function ageDays(ts, genTs) {
    var d = toDate(ts); var g = toDate(genTs) || new Date();
    if (!d) return null;
    return Math.floor((g.getTime() - d.getTime()) / 86400000);
  }
  function fmtAge(ts, genTs) {
    var a = ageDays(ts, genTs);
    if (a === null) return 'no date';
    if (a < 0) return 'future-dated';
    if (a === 0) return 'today';
    if (a === 1) return '1 day old';
    if (a < 60) return a + ' days old';
    var mo = Math.round(a / 30.44);
    if (mo < 24) return mo + ' mo old';
    return (a / 365.25).toFixed(1) + ' yr old';
  }
  function staleChip(o) {
    return (o && o.stale) ? '<span class="chip stale" title="older than this source\u2019s freshness budget">STALE</span>' : '';
  }
  function levelChip(level) {
    if (level === 'exceedance') return '<span class="chip exceed">EXCEEDS</span>';
    if (level === 'approaching') return '<span class="chip approach">APPROACHING</span>';
    return '';
  }
  function prettyParam(p) {
    var m = {
      microcystin: 'Microcystin', cylindrospermopsin: 'Cylindrospermopsin',
      saxitoxin: 'Saxitoxin', 'anatoxin-a': 'Anatoxin-A',
      cyan_index: 'CyAN satellite index', chlorophyll_a_bluegreen: 'Chlorophyll-a (blue-green)',
      phycocyanin: 'Phycocyanin', beach_hazards_statement: 'NWS Beach Hazards Statement',
      marine_weather_statement: 'NWS Marine Weather Statement'
    };
    return m[p] || p;
  }

  /* --------------------------------------------------------------- indexing */
  function indexBlob(b) {
    var ix = { byId: {}, obsBySite: {}, alertsBySite: {}, satBySite: {}, baseBySite: {} };
    (b.sites || []).forEach(function (s) { ix.byId[s.id] = s; });
    (b.observations || []).forEach(function (o) {
      (ix.obsBySite[o.site_id] = ix.obsBySite[o.site_id] || []).push(o);
    });
    (b.alerts || []).forEach(function (a) {
      (ix.alertsBySite[a.site_id] = ix.alertsBySite[a.site_id] || []).push(a);
    });
    (b.satellite || []).forEach(function (s) { ix.satBySite[s.site_id] = s; });
    (b.baselines || []).forEach(function (s) { ix.baseBySite[s.site_id] = s; });
    return ix;
  }
  // Newest observation overall, and newest that actually carries a value.
  function latestOf(obs, gen) {
    var latest = null, valued = null;
    (obs || []).forEach(function (o) {
      if (!o.ts) return;
      if (!latest || String(o.ts) > String(latest.ts)) latest = o;
      if (isNum(o.value) && (!valued || String(o.ts) > String(valued.ts))) valued = o;
    });
    return { latest: latest, valued: valued, age: valued ? fmtAge(valued.ts, gen) : (latest ? fmtAge(latest.ts, gen) : 'no data') };
  }
  function stateOf(ix, id) {
    var s = ix.byId[id];
    return (s && s.state) ? s.state : null;
  }
  function unverified(blob) {
    var a = blob.alerts || [];
    for (var i = 0; i < a.length; i++) if (a[i].verified === false) return true;
    var s = (blob.sources || []);
    for (var j = 0; j < s.length; j++) if (String(s[j].url || '') && /VERIFY/.test(String(s[j].note || ''))) return true;
    return false;
  }

  /* ---------------------------------------------------- persistent notices */
  function bannerHtml(blob) {
    if (blob && blob.mode === 'offline') {
      return '<div class="banner synth">SYNTHETIC DATA — this build came from the offline collector, '
        + 'so the satellite layer is generated, not observed. Do not treat any value here as federal data.</div>';
    }
    return '';
  }
  function thresholdFlagHtml(blob) {
    if (!unverified(blob)) return '';
    return '<div class="banner warn">Thresholds UNVERIFIED — the EPA criteria driving alerts have not been '
      + 'confirmed against the EPA source yet. Treat exceedances as provisional.</div>';
  }

  /* --------------------------------------------------------------- view: map */
  function mercY(lat) {
    var r = lat * Math.PI / 180;
    return Math.log(Math.tan(Math.PI / 4 + r / 2));
  }
  function project(lon, lat, w, h, view) {
    var v = view || defaultView();
    return {
      x: (lon - v.lon0) / (v.lon1 - v.lon0) * w,
      y: (mercY(lat) - v.my0) / (v.my1 - v.my0) * h
    };
  }
  function colorFor(v) {
    for (var i = 0; i < COLORS.length; i++) if (v < COLORS[i].max) return COLORS[i].c;
    return COLORS[COLORS.length - 1].c;
  }
  // ---- pan / zoom maths -------------------------------------------------
  // The view lives in Mercator space: {lon0, lon1, my0, my1} with my = mercY(lat).
  // Keeping latitude in Mercator space keeps the satellite grid, the site pins
  // and the basemap tiles aligned at every zoom level.
  function myInv(my) { return (2 * Math.atan(Math.exp(my)) - Math.PI / 2) * 180 / Math.PI; }
  function defaultView() { return viewFromExtent(MAP_EXTENT); }
  function viewFromExtent(ext) {
    return { lon0: ext.lon0, lon1: ext.lon1, my0: mercY(ext.lat1), my1: mercY(ext.lat0) };
  }
  function viewBounds(v) {
    return { lon0: v.lon0, lon1: v.lon1, lat0: myInv(v.my1), lat1: myInv(v.my0) };
  }
  function clampView(v) {
    // CONVENTION: my0 is the NORTH edge, my1 the SOUTH edge, so the height
    // span is (my0 - my1) and is POSITIVE. Getting this backwards silently
    // collapses the view (the bug this comment exists to prevent).
    var MINW = 0.02;                       // ~2 km across: the CyAN cell scale
    var MINH = MINW * 0.5;
    var lim = mercY(85);
    if (v.lon1 - v.lon0 > 360) { var c1 = (v.lon0 + v.lon1) / 2; v.lon0 = c1 - 180; v.lon1 = c1 + 180; }
    if (v.lon1 - v.lon0 < MINW) { var c2 = (v.lon0 + v.lon1) / 2; v.lon0 = c2 - MINW / 2; v.lon1 = c2 + MINW / 2; }
    if (v.my0 - v.my1 < MINH) { var c3 = (v.my0 + v.my1) / 2; v.my0 = c3 + MINH / 2; v.my1 = c3 - MINH / 2; }
    if (v.my0 - v.my1 > 2 * lim) { var c4 = (v.my0 + v.my1) / 2; v.my0 = c4 + lim; v.my1 = c4 - lim; }
    if (v.my0 > lim) { var d0 = v.my0 - lim; v.my0 -= d0; v.my1 -= d0; }
    if (v.my1 < -lim) { var d1 = -lim - v.my1; v.my0 += d1; v.my1 += d1; }
    return v;
  }
  function fitView(points, padFrac) {
    var lats = [], lons = [];
    (points || []).forEach(function (p) {
      if (p && isNum(p.lat) && isNum(p.lon)) { lats.push(p.lat); lons.push(p.lon); }
    });
    if (!lats.length) return defaultView();
    var lat0 = Math.min.apply(null, lats), lat1 = Math.max.apply(null, lats);
    var lon0 = Math.min.apply(null, lons), lon1 = Math.max.apply(null, lons);
    var pad = (padFrac === undefined) ? 0.35 : padFrac;
    var dLat = Math.max(lat1 - lat0, 0.05), dLon = Math.max(lon1 - lon0, 0.05);
    return clampView(viewFromExtent({
      lon0: lon0 - dLon * pad, lon1: lon1 + dLon * pad,
      lat0: lat0 - dLat * pad, lat1: lat1 + dLat * pad
    }));
  }
  function zoomView(v, factor, fx, fy) {
    fx = isNum(fx) ? fx : 0.5;
    fy = isNum(fy) ? fy : 0.5;
    var ws = v.lon1 - v.lon0, hs = v.my0 - v.my1;   // hs positive (see convention)
    var nw = ws / factor, nh = hs / factor;
    var ax = v.lon0 + ws * fx;                      // anchor longitudes
    var ay = v.my0 - hs * fy;                       // fy measured down from the north edge
    return clampView({
      lon0: ax - nw * fx, lon1: ax + nw * (1 - fx),
      my0: ay + nh * fy, my1: ay - nh * (1 - fy)
    });
  }
  function panView(v, dxPx, dyPx, wPx, hPx) {
    var ws = v.lon1 - v.lon0, hs = v.my0 - v.my1;
    var dLon = (dxPx / Math.max(wPx, 1)) * ws;
    var dMy = (dyPx / Math.max(hPx, 1)) * hs;
    // Dragging right/down reveals west/north: the window moves with the pointer.
    return clampView({ lon0: v.lon0 - dLon, lon1: v.lon1 - dLon, my0: v.my0 + dMy, my1: v.my1 + dMy });
  }
  function unproject(x, y, w, h, view) {
    var v = view || defaultView();
    return {
      lon: v.lon0 + (x / Math.max(w, 1)) * (v.lon1 - v.lon0),
      lat: myInv(v.my0 + (y / Math.max(h, 1)) * (v.my1 - v.my0))
    };
  }
  function tileZoomFor(v, wPx) {
    var span = v.lon1 - v.lon0;
    var z = Math.log(360 / span) / Math.LN2 + Math.log(Math.max(wPx, 256) / 256) / Math.LN2;
    return Math.max(2, Math.min(11, Math.round(z)));
  }
  function buildMapModel(blob, ix) {
    var sat = (blob.satellite || []).filter(function (s) { return s && s.grid && s.grid.length; });
    var pins = (blob.sites || []).filter(function (s) { return isNum(s.lat) && isNum(s.lon); });
    var noCoords = (blob.sites || []).filter(function (s) { return !isNum(s.lat) || !isNum(s.lon); }).length;
    return {
      sat: sat, pins: pins, noCoords: noCoords,
      extent: MAP_EXTENT,
      pinAlerts: pins.reduce(function (acc, s) {
        var al = ix.alertsBySite[s.id] || [];
        acc[s.id] = al.some(function (a) { return a.level === 'exceedance'; }) ? 'exceedance'
          : (al.some(function (a) { return a.level === 'approaching'; }) ? 'approaching' : 'none');
        return acc;
      }, {})
    };
  }
  function drawMap(canvas, blob, ix, view, lw, lh) {
    if (!canvas || typeof canvas.getContext !== 'function') return 0;
    var ctx = canvas.getContext('2d');
    if (!ctx) return 0;
    // lw/lh are LOGICAL (CSS pixel) dimensions: the backing store may be
    // scaled by devicePixelRatio, so canvas.width is not the drawing space.
    var w = lw || canvas.width || 900;
    var h = lh || canvas.height || Math.round(w * 0.46);
    // NOTE: named vw, not v - the grid loop below already uses `v` for the
    // cell value, and `var` is function-scoped, so `v` would be clobbered.
    var vw = view || defaultView();
    var model = buildMapModel(blob, ix || indexBlob(blob));
    var ops = 0;
    ctx.clearRect(0, 0, w, h);
    // TRANSLUCENT wash, not an opaque fill. The canvas is stacked ABOVE the
    // .gov basemap tile layer, so an opaque background hides the entire map
    // behind a flat box. Alpha < 1 lets the tiles read through while still
    // darkening them enough for the cyanobacteria ramp and pins to pop.
    ctx.fillStyle = 'rgba(13,20,32,0.45)';
    ctx.fillRect(0, 0, w, h); ops++;
    // satellite grid cells (2 km CyAN slices, per watchlist site)
    model.sat.forEach(function (s) {
      var bbox = s.bbox || [];
      if (bbox.length !== 4) return;
      var latLo = bbox[0], lonLo = bbox[1], latHi = bbox[2], lonHi = bbox[3];
      var rows = s.grid.length, cols = s.grid[0].length;
      var dLat = (latHi - latLo) / rows, dLon = (lonHi - lonLo) / cols;
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var v = s.grid[r][c];
          if (!isNum(v)) continue;   // no retrieval -> leave unpainted, never 0
          var lat = latHi - dLat * r;              // row 0 is the NORTH edge
          var lon = lonLo + dLon * c;              // col 0 is the WEST edge
          var p1 = project(lon, lat, w, h, vw);
          var p2 = project(lon + dLon, lat - dLat, w, h, vw);
          if (p2.x < 0 || p1.x > w || p2.y < 0 || p1.y > h) continue;   // cull off-screen
          ctx.fillStyle = colorFor(v);
          ctx.fillRect(p1.x, p1.y, Math.max(1, p2.x - p1.x), Math.max(1, p2.y - p1.y));
          ops++;
        }
      }
    });
    // site pins
    model.pins.forEach(function (s) {
      var p = project(s.lon, s.lat, w, h, vw);
      if (p.x < -24 || p.x > w + 24 || p.y < -24 || p.y > h + 24) return;
      var level = model.pinAlerts[s.id];
      ctx.beginPath();
      ctx.arc(p.x, p.y, s.watch ? 6 : 3.5, 0, Math.PI * 2);
      ctx.fillStyle = level === 'exceedance' ? '#ef4444' : (level === 'approaching' ? '#f59e0b' : '#8892b0');
      ctx.fill(); ops++;

      var p = project(s.lon, s.lat, w, h, v);

  /* --------------------------------------------------------------- dispatch */
  function renderView(name, blob, ix, ui) {
    if (!blob) return '<div class="empty">No baked data found in this build.</div>';
    ix = ix || indexBlob(blob);
    ui = ui || uiState(blob);
    if (name === 'map') return renderMap(blob, ix, ui);
    if (name === 'watchlist') return watchlistHtml(blob, ix, ui);
    if (name === 'site') return renderSite(blob, ix, ui);
    if (name === 'anomaly') return renderAnomaly(blob, ix);
    if (name === 'alerts') return renderAlerts(blob, ix);
    if (name === 'sources') return renderSources(blob);
    return '<div class="empty">Unknown view.</div>';
  }
  function viewCount(name, blob) {
    if (name === 'alerts') return (blob.alerts || []).length;
    if (name === 'watchlist') return 0;
    if (name === 'sources') return (blob.sources || []).length;
    if (name === 'anomaly') return (blob.baselines || []).length;
    if (name === 'map') return (blob.satellite || []).length;
    return 0;
  }

  /* ------------------------------------------------------------------ state */
  function defaultState(blob) {
    var watch = (blob.sites || []).filter(function (s) { return s.watch; }).map(function (s) { return s.id; });
    return { view: 'map', site: watch.length ? watch[0] : null, watch: watch };
  }
  function deepMerge(t, o) {
    if (!o || typeof o !== 'object') return t;
    Object.keys(o).forEach(function (k) {
      var v = o[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) {
        t[k] = deepMerge(t[k], v);
      } else if (v !== undefined && v !== null) { t[k] = v; }
    });
    return t;
  }
  function loadState(blob) {
    var d = defaultState(blob || {});
    try {
      var raw = (typeof localStorage !== 'undefined') ? localStorage.getItem(LS_KEY) : null;
      if (raw) return deepMerge(d, JSON.parse(raw));
    } catch (e) { /* schema drift or corrupt storage must never break the app */ }
    return d;
  }
  function saveState(s) {
    try { if (typeof localStorage !== 'undefined') localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function uiState(blob) {
    if (BLOB && blob === BLOB) return loadState(blob);
    return defaultState(blob || {});
  }

  /* ---------------------------------------------------------------- browser */
  var IS_BROWSER = (typeof document !== 'undefined' && typeof window !== 'undefined'
    && typeof window.addEventListener === 'function' && typeof document.createElement === 'function');

  function init() {
    var app = document.getElementById('app');
    var tabs = document.getElementById('tabs');
    var genStamp = document.getElementById('genStamp');
    var modeBanner = document.getElementById('modeBanner');
    var thresholdFlag = document.getElementById('thresholdFlag');
    var footNote = document.getElementById('footNote');
    if (!app || !BLOB) return;
    var ix = indexBlob(BLOB);
    var ui = loadState(BLOB);
    if (!ui.site || !ix.byId[ui.site]) ui.site = (ui.watch[0] || null);

    if (genStamp) genStamp.textContent = BLOB.generated_utc || '—';
    if (modeBanner && BLOB.mode === 'offline') modeBanner.classList.remove('hidden');
    if (thresholdFlag && unverified(BLOB)) thresholdFlag.classList.remove('hidden');
    if (footNote) {
      footNote.textContent = 'Generated from official U.S. federal sources. Thresholds provisional until '
        + 'confirmed against the EPA source. A blank state means no data was reported \u2014 not that water was clean.';
    }

    tabs.innerHTML = VIEWS.map(function (v) {
      var n = viewCount(v.id, BLOB);
      return '<button class="tab" role="tab" data-view="' + v.id + '">' + v.label
        + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
    }).join('');

    function paint() {
      Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function (b) {
        b.classList.toggle('active', b.dataset.view === ui.view);
      });
      app.innerHTML = renderView(ui.view, BLOB, ix, ui);
      if (ui.view === 'map') {
        var c = document.getElementById('awmap');
        var box = (c && c.parentElement) ? c.parentElement.clientWidth : 1000;
        // Do NOT clamp this to 1000px: the tile layer is absolutely positioned
        // to the FULL map box (inset:0), so a narrower canvas projects the
        // basemap at the wrong scale and leaves stray tiles at the edges.
        var cssW = Math.max(260, box || 1000);
        var cssH = Math.round(cssW * 0.46);
        var dpr = window.devicePixelRatio || 1;
        if (c) {
          c.style.width = cssW + 'px';
          c.style.height = cssH + 'px';
          c.width = Math.round(cssW * dpr);
          c.height = Math.round(cssH * dpr);
          var ctx = c.getContext('2d');
          if (ctx && ctx.scale) ctx.scale(dpr, dpr);
        }
        if (ui.mapView && ui.mapView.lon0 !== undefined) {
          mapView = ui.mapView;                        // restore the saved view
        } else if (!mapView) {
          // Default to the watchlist footprint. Each CyAN window is only ~0.6
          // degrees wide, so a CONUS-wide default renders them as specks.
          mapView = fitView((ui.watch || []).map(function (id) { return ix.byId[id]; }), 0.25);
        }
        drawMap(c, BLOB, ix, mapView, cssW, cssH);
        addTiles(document.getElementById('maptiles'), cssW, cssH, mapView);
        wireMap(c, cssW, cssH, ix, ui, paint);
        updateStatus();
      }
      if (ui.view === 'site') drawChart();
    }

    // Optional .gov basemap. Purely decorative: if the tiles are blocked or
    // offline, the grid and pins above still render.
    function persistView() {
      ui.mapView = { lon0: mapView.lon0, lon1: mapView.lon1, my0: mapView.my0, my1: mapView.my1 };
      saveState(ui);
    }
    function updateStatus() {
      var st = document.getElementById('mapstatus');
      if (!st) return;
      var b = viewBounds(mapView);
      var tiles = document.getElementById('maptiles');
      var noBase = tiles && tiles.style.display === 'none';
      st.textContent = Math.abs(b.lon1 - b.lon0).toFixed(2) + '\u00b0 \u00d7 '
        + Math.abs(b.lat1 - b.lat0).toFixed(2) + '\u00b0 \u00b7 '
        + (BLOB.satellite || []).length + ' satellite windows in this build'
        + (noBase ? ' \u00b7 basemap blocked, grid + pins only' : '');
    }
    function mapRedraw(canvas, w, h, ix) {
      drawMap(canvas, BLOB, ix, mapView, w, h);
      addTiles(document.getElementById('maptiles'), w, h, mapView);
      updateStatus();
    }
    function wireMap(canvas, w, h, ix, u, repaint) {
      if (!canvas) return;
      var dragging = false, moved = 0, lastX = 0, lastY = 0, tOffX = 0, tOffY = 0;
      var tileHost = document.getElementById('maptiles');
      var ptrs = {}, pinchDist = 0, pinchMid = null;   // live pointers, for pinch
      function pinchState() {
        var p = Object.keys(ptrs).map(function (k) { return ptrs[k]; });
        if (p.length < 2) return null;
        var dx = p[0].x - p[1].x, dy = p[0].y - p[1].y;
        return { d: Math.sqrt(dx * dx + dy * dy), mx: (p[0].x + p[1].x) / 2, my: (p[0].y + p[1].y) / 2 };
      }
      function forgetPointer(e) {
        if (e && e.pointerId !== undefined) delete ptrs[e.pointerId];
        endDrag();
      }
      canvas.addEventListener('wheel', function (e) {
        e.preventDefault();
        var r = canvas.getBoundingClientRect();
        mapView = zoomView(mapView, e.deltaY < 0 ? 1.3 : 1 / 1.3,
          (e.clientX - r.left) / Math.max(r.width, 1),
          (e.clientY - r.top) / Math.max(r.height, 1));
        persistView();
        mapRedraw(canvas, w, h, ix);
      }, { passive: false });
      canvas.addEventListener('pointerdown', function (e) {
        ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
        dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
        tOffX = 0; tOffY = 0;
        // Seed the pinch baseline as soon as the SECOND finger lands, otherwise
        // the first move only initialises the distance and the gesture appears
        // to do nothing for a frame.
        var ps0 = pinchState();
        pinchDist = ps0 ? ps0.d : 0;
        pinchMid = ps0 ? { x: ps0.mx, y: ps0.my } : null;
        if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
      });
      canvas.addEventListener('pointermove', function (e) {
        if (ptrs[e.pointerId]) ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
        // TWO-FINGER PINCH: zoom about the midpoint and never pan, so the point
        // under the fingers stays put. The hint advertises pinch, so it has to
        // actually work rather than silently falling through to a drag.
        var ps = pinchState();
        if (ps) {
          var pr = canvas.getBoundingClientRect();
          if (pinchDist > 0 && ps.d > 0 && pinchMid) {
            var k = ps.d / pinchDist;
            mapView = zoomView(mapView, k,
              (ps.mx - pr.left) / Math.max(pr.width, 1),
              (ps.my - pr.top) / Math.max(pr.height, 1));
            // TWO-FINGER DRAG: carry the geography that was under the old
            // midpoint over to the new one so it stays under the fingers. The
            // travel must be scaled by k as well -- the content is k times
            // bigger now, so the midpoint delta has to be magnified to match.
            // (Using the raw delta left the pinned point exactly where it
            // started, which is what the geometry gate caught.)
            var px = k * (ps.mx - pinchMid.x) / Math.max(pr.width, 1);
            var py = k * (ps.my - pinchMid.y) / Math.max(pr.height, 1);
            var spanX = mapView.lon1 - mapView.lon0, spanY = mapView.my0 - mapView.my1;
            mapView = clampView({
              lon0: mapView.lon0 - px * spanX, lon1: mapView.lon1 - px * spanX,
              my0: mapView.my0 + py * spanY, my1: mapView.my1 + py * spanY
            });
            persistView();
            mapRedraw(canvas, w, h, ix);
          }
          pinchDist = ps.d;
          pinchMid = { x: ps.mx, y: ps.my };
          dragging = false;
          tOffX = 0; tOffY = 0;
          return;
        }
        if (!dragging) return;
        var dx = e.clientX - lastX, dy = e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        moved += Math.abs(dx) + Math.abs(dy);
        // TANDEM: the pins and the basemap must travel together. Rebuilding every
        // <img> on each pointermove flickers, so the tile layer is TRANSLATED --
        // and by the pixel shift the VIEW ACTUALLY TOOK, not the raw pointer
        // delta, otherwise the two desync wherever clampView() refuses to move.
        var lon0Before = mapView.lon0, my0Before = mapView.my0;
        mapView = panView(mapView, dx, dy, w, h);
        var spanX = mapView.lon1 - mapView.lon0, spanY = mapView.my0 - mapView.my1;
        tOffX += (lon0Before - mapView.lon0) / spanX * w;
        tOffY += (mapView.my0 - my0Before) / spanY * h;
        drawMap(canvas, BLOB, ix, mapView, w, h);
        if (tileHost) {
          if (Math.abs(tOffX) > 256 || Math.abs(tOffY) > 256) {
            // Long drag: re-tile for the current view so the edges stay covered.
            // addTiles() clears the offset, so this is seamless, not a jump.
            addTiles(tileHost, w, h);
            tOffX = 0; tOffY = 0;
          } else {
            tileHost.style.transform =
              'translate(' + tOffX.toFixed(1) + 'px,' + tOffY.toFixed(1) + 'px)';
          }
        }
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false;
        tOffX = 0; tOffY = 0;
        persistView();
        mapRedraw(canvas, w, h, ix);
      }
      canvas.addEventListener('pointerup', function (e) {
        delete ptrs[e.pointerId];
        var wasDrag = moved > 6;
        var wasPinch = pinchDist > 0;            // a pinch is not a click
        endDrag();
        if (wasDrag || wasPinch) return;
        var r = canvas.getBoundingClientRect();
        var hit = nearestSite(ix,
          (e.clientX - r.left) / Math.max(r.width, 1) * w,
          (e.clientY - r.top) / Math.max(r.height, 1) * h, w, h, 16, mapView);
        if (hit) { u.site = hit.id; u.view = 'site'; saveState(u); repaint(); }
      });
      canvas.addEventListener('pointercancel', forgetPointer);
      canvas.addEventListener('pointerleave', forgetPointer);
      canvas.addEventListener('dblclick', function (e) {
        var r = canvas.getBoundingClientRect();
        mapView = zoomView(mapView, 1.6,
          (e.clientX - r.left) / Math.max(r.width, 1),
          (e.clientY - r.top) / Math.max(r.height, 1));
        persistView();
        mapRedraw(canvas, w, h, ix);
      });
      var box = document.getElementById('mapbox');
      if (box) {
        box.addEventListener('click', function (e) {
          var b = e.target && e.target.closest ? e.target.closest('[data-map]') : null;
          if (!b) return;
          e.preventDefault();
          var act = b.getAttribute('data-map');
          if (act === 'in') mapView = zoomView(mapView, 1.5, 0.5, 0.5);
          else if (act === 'out') mapView = zoomView(mapView, 1 / 1.5, 0.5, 0.5);
          else if (act === 'fit') mapView = fitView((u.watch || []).map(function (id) { return ix.byId[id]; }), 0.25);
          else mapView = defaultView();
          persistView();
          mapRedraw(canvas, w, h, ix);
        });
      }
    }
    function addTiles(host, w, h) {
      if (!host) return;
      var v = mapView || defaultView();
      var z = tileZoomFor(v, w);
      var n = Math.pow(2, z);
      function lonTile(lon) { return (lon + 180) / 360 * n; }
      function latTile(lat) {
        var r = lat * Math.PI / 180;
        return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n;
      }
      function tile2lon(x) { return x / n * 360 - 180; }
      function tile2lat(y) { return Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n))) * 180 / Math.PI; }
      var b = viewBounds(v);
      var x0 = lonTile(b.lon0), x1 = lonTile(b.lon1);
      var y0 = latTile(b.lat1), y1 = latTile(b.lat0);
      var html = '', loaded = 0, tried = 0, MAXT = 96;
      for (var tx = Math.floor(x0); tx <= Math.floor(x1) && tried < MAXT; tx++) {
        for (var ty = Math.floor(y0); ty <= Math.floor(y1) && tried < MAXT; ty++) {
          if (ty < 0 || ty >= n) continue;
          var q1 = project(tile2lon(tx), tile2lat(ty), w, h, v);
          var q2 = project(tile2lon(tx + 1), tile2lat(ty + 1), w, h, v);
          tried++;
          html += '<img alt="" loading="lazy" style="left:' + q1.x.toFixed(1) + 'px;top:' + q1.y.toFixed(1)
            + 'px;width:' + Math.ceil(q2.x - q1.x).toFixed(1) + 'px;height:' + Math.ceil(q2.y - q1.y).toFixed(1) + 'px"'
            + ' src="https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/'
            + z + '/' + ty + '/' + tx + '">';
        }
      }
      host.innerHTML = html;
      host.style.display = '';
      host.style.transform = '';   // every fresh render starts untranslated
      Array.prototype.forEach.call(host.querySelectorAll('img'), function (im) {
        // A CACHED image can finish loading before this handler is attached, so
        // `onload` alone never fires and `loaded` stays 0 - the 2.5s watchdog
        // below would then hide a perfectly good basemap. Check .complete first.
        if (im.complete && im.naturalWidth > 0) { loaded++; return; }
        im.addEventListener('load', function () { loaded++; });
        im.addEventListener('error', function () {
          host.style.display = 'none';
          updateStatus();
        });
      });
      setTimeout(function () {
        if (loaded === 0 && tried > 0 && host.style.display !== 'none') {
          host.style.display = 'none';
          updateStatus();
        }
      }, 2500);
    }

    function drawChart() {
      var c = document.getElementById('awchart');
      if (!c) return;
      var sat = ix.satBySite[ui.site];
      if (!sat || !sat.grid || !sat.grid.length) return;
      var ctx = c.getContext('2d');
      if (!ctx) return;
      var w = c.width, h = c.height;
      var vals = [];
      sat.grid.forEach(function (row) { row.forEach(function (v) { if (isNum(v)) vals.push(v); }); });
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#13131f'; ctx.fillRect(0, 0, w, h);
      if (!vals.length) {
        ctx.fillStyle = '#6868a0';
        ctx.font = '12px sans-serif';
        ctx.fillText('No satellite retrieval in this window (cloud or land) — not zero.', 10, h / 2);
        return;
      }
      var max = Math.max.apply(null, vals), bw = w / vals.length;
      vals.forEach(function (v, i) {
        var bh = (v / max) * (h - 24);
        ctx.fillStyle = colorFor(v);
        ctx.fillRect(i * bw, h - 18 - bh, Math.max(1, bw - 0.5), bh);
      });
      ctx.fillStyle = '#6868a0';
      ctx.font = '11px sans-serif';
      ctx.fillText('CyAN index, ' + vals.length + ' retrieved cells (max ' + max.toFixed(2) + ' mg m\u207b\u00b3)', 6, 12);
    }

    tabs.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.tab') : null;
      if (!b) return;
      ui.view = b.dataset.view;
      saveState(ui);
      paint();
    });
    app.addEventListener('click', function (e) {
      var t = e.target;
      var site = t.getAttribute && t.getAttribute('data-site');
      if (site) { e.preventDefault(); ui.site = site; ui.view = 'site'; saveState(ui); paint(); return; }
      var un = t.getAttribute && t.getAttribute('data-unwatch');
      var focus = t.getAttribute && t.getAttribute('data-mapfocus');
      if (focus && ix.byId[focus]) {
        // Frame the site's actual CyAN window (0.6 deg), not just its pin.
        var sat = ix.satBySite[focus];
        var pts = (sat && sat.bbox && sat.bbox.length === 4)
          ? [{ lat: sat.bbox[0], lon: sat.bbox[1] }, { lat: sat.bbox[2], lon: sat.bbox[3] }]
          : [ix.byId[focus]];
        mapView = fitView(pts, 0.25);
        ui.mapView = mapView;
        ui.view = 'map';
        saveState(ui);
        paint();
        return;
      }
      if (un) {
        ui.watch = ui.watch.filter(function (x) { return x !== un; });
        if (ui.site === un) ui.site = ui.watch[0] || null;
        saveState(ui); paint(); return;
      }
      if (t.id === 'addBtn') {
        var sel = document.getElementById('addSite');
        if (sel && sel.value) {
          if (ui.watch.indexOf(sel.value) < 0) ui.watch.push(sel.value);
          ui.site = sel.value;
          saveState(ui); paint();
        }
      }
    });

    paint();
  }

  /* ------------------------------------------------------------- public API */
  var API = {
    VIEWS: VIEWS, MAP_EXTENT: MAP_EXTENT, COLORS: COLORS,
    esc: esc, fmtValue: fmtValue, fmtAge: fmtAge, ageDays: ageDays,
    prettyParam: prettyParam, indexBlob: indexBlob, latestOf: latestOf,
    bannerHtml: bannerHtml, thresholdFlagHtml: thresholdFlagHtml, unverified: unverified,
    project: project, colorFor: colorFor, buildMapModel: buildMapModel, drawMap: drawMap,
    defaultView: defaultView, viewFromExtent: viewFromExtent, viewBounds: viewBounds,
    clampView: clampView, fitView: fitView, zoomView: zoomView, panView: panView,
    unproject: unproject, tileZoomFor: tileZoomFor, nearestSite: nearestSite,
    getMapView: function () { return mapView; },
    setMapView: function (v) { mapView = v; return mapView; },
    renderView: renderView, defaultState: defaultState, deepMerge: deepMerge, viewCount: viewCount
  };
  if (typeof window !== 'undefined') window.__AW__ = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;

  if (IS_BROWSER) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  }
})();
</script>
</body>
